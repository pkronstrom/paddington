# Menu navigation: entered after a binding with then = "menu-nav" (e.g. Rewind, /model).
# Like lists: only the middle four pads are lit — left red ✕ backs out (Esc, pads 6, 10), right green ✓ selects
# (Enter, pads 7, 11); other pads are off. Knobs and < > move. When padctl can read the menu's numbered options
# on screen, pads 1–8 show them instead (layers/choices.toml) and pick one; pads 10 / 11 stay red / green.
name    = "Menu"
kind    = "modal"
color   = "#ffd43b"
timeout = "30s"
exit    = ["play", "pad7", "pad11", "pad1", "pad2", "pad3", "pad4", "pad5", "pad8"]   # select: counts then_steps
cancel  = ["pause", "pad6", "pad10"]                                                 # leaves at once

knob1 = { label = "↑ ↓",  keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav", sound = "scroll" }
knob2 = { label = "Page", keys = { cw = "pagedown", ccw = "pageup" }, to = "pane", color = "nav", sound = "scroll" }
knob4 = { label = "← →",  keys = { cw = "right", ccw = "left" }, to = "pane", color = "nav", sound = "scroll" }
knob7 = { label = "↑ ↓",  keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav", sound = "scroll" }
knob8 = { label = "↑ ↓",  keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav", sound = "scroll" }
play  = { label = "✓ Select", keys = "enter", to = "pane", color = "ok", sound = "select" }
pause = { label = "✕ Back",   keys = "esc", to = "pane", color = "danger", sound = "cancel" }
left  = { label = "↑ Up",     keys = "up", to = "pane", color = "nav", sound = "scroll" }
right = { label = "↓ Down",   keys = "down", to = "pane", color = "nav", sound = "scroll" }

pad6  = { label = "✕ Back",   keys = "esc", to = "pane", if = "not q.active", color = "danger", sound = "cancel" }
pad7  = { label = "✓ Select", keys = "enter", to = "pane", if = "not q.active", color = "ok", sound = "select" }
pad10 = { label = "✕ Back",   keys = "esc", to = "pane", color = "danger", sound = "cancel" }
pad11 = { label = "✓ Select", keys = "enter", to = "pane", color = "ok", sound = "select" }

# off: the rest — pads 1–8 unless the menu's options are readable (then the Choose layer below shows them)
pad1  = { if = "not q.active", color = "off" }
pad2  = { if = "not q.active", color = "off" }
pad3  = { if = "not q.active", color = "off" }
pad4  = { if = "not q.active", color = "off" }
pad5  = { if = "not q.active", color = "off" }
pad8  = { if = "not q.active", color = "off" }
pad9  = { color = "off" }
pad12 = { color = "off" }
pad13 = { color = "off" }
pad14 = { color = "off" }
pad15 = { color = "off" }
pad16 = { color = "off" }
