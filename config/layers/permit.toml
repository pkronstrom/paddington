# An agent asks for permission (Claude's "Do you want to proceed?", Codex approvals) — read from the screen,
# or from Claude's hook. Same spots as Confirm: pad 11 green ✓ Yes (blinks: waits for you), pad 10 and the
# whole top row red ✕ No (Esc: tell it what to do instead), pad 12 cyan "Yes, and don't ask again" when
# offered. Other pads are off; knobs and < > still work.
name      = "Allow?"
kind      = "modal"
color     = "#ff922b"
exclusive = true
auto      = "q.confirm or agent.status == 'needs_approval'"

pad10 = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
pad11 = { label = "✓ Yes", answer = "yes", color = "ok", look = "attention", to = "pane" }
pad12 = { label = "✓ Always", answer = "always", if = "q.always", color = "sys", to = "pane", desc = "{q.always.label}" }
pad13 = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
pad14 = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
pad15 = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
pad16 = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
knob1 = { label = "↑ ↓ options", keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav" }
play  = { label = "✓ Yes", answer = "yes", color = "ok", to = "pane", hold = { legend = "show" } }
pause = { label = "✕ No", answer = "no", color = "danger", to = "pane" }
