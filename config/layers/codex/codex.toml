# Codex ruleset: a tmux pane running `codex`. Rows 1–3, buttons and knobs 1–6 come from tmux.toml;
# this file sets row 4 (agent verbs) and knobs 7–8. Codex has no hooks yet, so windows show no agent status.

name    = "Codex"
kind    = "base"
extends = "tmux"
color   = "#10a37f"
when    = { app = ["com.googlecode.iterm2"], tmux_cmd = ["codex"] }

play  = { label = "Submit", keys = "enter", color = "ok", hold = { legend = "show" }, desc = "tap: Enter · hold: show the legend" }
pause = { label = "Esc",    keys = "esc", color = "warn", desc = "Esc on press: stop the running turn" }

# ── row 4: agent verbs (same spots as Claude) ─────────────────
pad13 = { label = "Backtrack",  keys = "esc esc", color = "act", desc = "Esc Esc — edit a previous message (empty input)" }
pad14 = { label = "Approvals",  text = "/approvals\n", then = "menu-nav", color = "act", desc = "pick the approval mode — knob ↑↓, any pad selects" }
pad15 = { label = "Compact",    text = "/compact\n", color = "act" }
pad16 = { label = "Commands…",  picker = "codex-commands", color = "skill" }

# ── knobs 7–8: settings (Codex's own /model menu) ─────────────
knob7 = { label = "Model",     text = "/model\n", then = "menu-nav", color = "act", desc = "opens /model — keep turning to move, any pad selects" }
knob8 = { label = "Reasoning", text = "/model\n", then = "menu-nav", color = "act", desc = "opens /model (model + reasoning) — turn to move, any pad selects" }

[shift]
pad13 = { label = "/new",     text = "/new\n", confirm = "hold", color = "danger" }
pad14 = { label = "/status",  text = "/status\n", color = "sys" }
pad15 = { label = "/init",    text = "/init\n", color = "skill" }
pad16 = { label = "/mention", text = "/mention ", color = "act", desc = "attach a file — type or dictate the name" }
