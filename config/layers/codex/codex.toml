# Codex ruleset: a tmux pane running `codex`. Rows 1–2, buttons, knobs 1–6, Last window (12), New (15) and
# Close (16) come from tmux.toml; this file sets the agent verbs (9–11, 13–14) and knobs 7–8 — same spots as Claude.

name    = "Codex"
kind    = "base"
extends = "tmux"
color   = "#10a37f"
when    = { app = ["com.googlecode.iterm2"], tmux_cmd = ["codex"] }

play  = { label = "Submit", keys = "enter", color = "ok", hold = { legend = "show" }, desc = "tap: Enter · hold: show the legend" }
pause = { label = "Esc",    keys = "esc", color = "warn", desc = "Esc on press: stop the running turn" }

# ── row 3: Compact · ⇄ Pane · Backtrack · (Last window) — bank B: /new · Zoom · /status
pad9  = { label = "Compact",    text = "/compact\n", color = "act" }
pad10 = { label = "⇄ Pane",     tmux = ["select-pane", "-t", "{session}:.+"], color = "nav", desc = "jump between Codex and the shell beside it" }
pad11 = { label = "Backtrack",  keys = "esc esc", color = "act", desc = "Esc Esc — edit a previous message (empty input)" }

# ── row 4: Commands… · Prompts… · (New · Close) — bank B: /mention · Approvals
pad13 = { label = "Commands…",  picker = "codex-commands", color = "skill" }
pad14 = { label = "Prompts…", picker = "prompts", hold = { search = "prompts" }, with = { rec = { search = "prompts" } }, color = "skill", desc = "tap: list · hold, or press while holding ● Talk: search — type or say it, ▶ / Enter pastes it" }

# ── knobs 7–8: settings (Codex's own /model menu) ─────────────
knob7 = { label = "Model",     text = "/model\n", then = "menu-nav", then_steps = 2, color = "act", desc = "opens /model — keep turning to move, any pad selects" }
knob8 = { label = "Reasoning", text = "/model\n", then = "menu-nav", then_steps = 2, color = "act", desc = "opens /model (model + reasoning) — turn to move, any pad selects" }

[shift]
pad9  = { label = "/new",     text = "/new\n", confirm = "ask", color = "danger" }
pad10 = { label = "Zoom",     tmux = ["resize-pane", "-Z", "-t", "{pane}"], color = "act", desc = "this pane fills the window; again to restore" }
pad11 = { label = "/status",  text = "/status\n", color = "sys" }
pad13 = { label = "/mention", text = "/mention ", color = "act", desc = "attach a file — type or dictate the name" }
pad14 = { label = "Approvals",  text = "/approvals\n", then = "menu-nav", color = "act", desc = "pick the approval mode — knob ↑↓, green ✓ selects" }
