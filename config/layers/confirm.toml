# Asks before a destructive action (bindings with confirm = "ask", lists with confirm = true). Same as lists:
# only the middle four pads are lit — left red ✕ drops it (pads 6, 10), right green ✓ runs it (pads 7, 11; they
# blink: it waits for you). Every other pad is off. ▶ / ⏸ work too. Gives up after 8 s.
name      = "Confirm"
kind      = "modal"
color     = "#fa5252"
exclusive = true
timeout   = "8s"

pad6  = { label = "✕ Cancel", decide = "cancel", color = "danger" }
pad7  = { label = "✓ {confirm.label}", decide = "ok", color = "ok", look = "attention" }
pad10 = { label = "✕ Cancel", decide = "cancel", color = "danger" }
pad11 = { label = "✓ {confirm.label}", decide = "ok", color = "ok", look = "attention" }
play  = { label = "✓ OK", decide = "ok", color = "ok" }
pause = { label = "✕ Cancel", decide = "cancel", color = "danger" }
