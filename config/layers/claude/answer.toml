# Claude asks (AskUserQuestion): on top while the focused agent waits for an answer.
# Option labels come from the hook payload. Needs `padctl hooks install`.
name  = "Claude asks"
kind  = "modal"
color = "#fcc419"
auto  = "q.active"

pad1  = { label = "1 · {q.option.1}", answer = 1, if = "q.count >= 1", color = "ok", to = "pane" }
pad2  = { label = "2 · {q.option.2}", answer = 2, if = "q.count >= 2", color = "ok", to = "pane" }
pad3  = { label = "3 · {q.option.3}", answer = 3, if = "q.count >= 3", color = "ok", to = "pane" }
pad4  = { label = "4 · {q.option.4}", answer = 4, if = "q.count >= 4", color = "ok", to = "pane" }
knob1 = { label = "↑ ↓", keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav" }
left  = { label = "Prev question", keys = "left", to = "pane", color = "nav" }
right = { label = "Next question", keys = "right", to = "pane", color = "nav" }
play  = { label = "Submit", keys = "enter", to = "pane", color = "ok", hold = { legend = "show" } }
pause = { label = "Esc", keys = "esc", to = "pane", color = "danger" }
