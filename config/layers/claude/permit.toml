# Permission prompt: on top while the focused agent waits for approval.
# The options aren't in the hook payload, so only Yes (first option) and No are on buttons; knob 1 moves.
name  = "Permission"
kind  = "modal"
color = "#ff922b"
auto  = "agent.status == 'needs_approval'"

play  = { label = "Yes", keys = "enter", to = "pane", color = "ok", hold = { legend = "show" } }
pause = { label = "No / Esc", keys = "esc", to = "pane", color = "danger" }
knob1 = { label = "↑ ↓ options", keys = { cw = "down", ccw = "up" }, to = "pane", color = "nav" }
