# Claude Code ruleset: a tmux pane running `claude`. Rows 1–3, buttons and knobs 1–6 come from tmux.toml;
# this file sets row 4 (agent verbs) and knobs 7–8 (model, thinking). Layout grammar: see default.toml.
# Agent status comes from `padctl hooks install` (observe-only Claude Code hooks).

name    = "Claude Code"
kind    = "base"
extends = "tmux"
color   = "#d97757"
when    = { app = ["com.googlecode.iterm2"], tmux_cmd = ["claude"] }

play  = { label = "Submit", keys = "enter", color = "ok", hold = { legend = "show" }, desc = "tap: Enter · hold: show the legend" }
pause = { label = "Esc",    keys = "esc", look = "agent_working", desc = "Esc on press: once clears, twice interrupts · lit while the agent works" }

# ── row 4: agent verbs ────────────────────────────────────────
pad13 = { label = "Rewind",  text = "/rewind\n", then = "menu-nav", then_steps = 2, color = "act", desc = "/rewind — knob ↑↓, any pad selects (twice), ⏸ back" }
pad14 = { label = "Mode",    mode = "next", look = "agent_mode", hold = { picker = "modes" }, desc = "tap: next mode · hold: pick a mode" }
pad15 = { label = "Compact", text = "/compact\n", color = "act", look = "context_meter", desc = "/compact — colour shows context use: green < 50 %, yellow, red > 80 % (needs padctl statusline-tap)" }
pad16 = { label = "Skills…", picker = "skills", color = "skill", desc = "turn any knob to choose, any pad selects" }

# ── knobs 7–8: settings ───────────────────────────────────────
knob7 = { label = "Model",    picker = "model", color = "act" }
knob8 = { label = "Thinking", picker = "effort", color = "act" }

[shift]
pad13 = { label = "/clear",   text = "/clear\n", confirm = "hold", color = "danger" }
pad14 = { label = "/resume",  text = "/resume\n", then = "menu-nav", color = "act" }
pad15 = { label = "/handoff", text = "/handoff\n", color = "skill" }
pad16 = { label = "Prompts…", picker = "prompts", color = "skill" }
