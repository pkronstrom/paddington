# Paddington settings. Reloads automatically when saved.

device = "m-vave-smc-pad"          # file in devices/
projects_dir = "~"                 # {projects}: where New opens Claude / Codex, and what the "Claude in…" lists show

[roles]                            # optional: a control that acts as a held modifier
# shift  = "<control>"             # hold for each layer's [shift] bindings (SMC-PAD: its SHIFT sends no MIDI)
# legend = "<control>"             # hold: show the legend · tap: pin it

[banks]
pad_b = "shift"                    # PAD BANK B = each layer's [shift] bindings ("default" = Default layer)

[timing]
hold = "450ms"                     # tap vs hold
legend_hold = "250ms"              # hold ▶ this long to show the legend
confirm_hold = "1s"                # confirm = "hold" bindings
legend_pin = "8s"
passthrough_limit = "5m"           # safety release for held keys (talk)

[legend]
position = "bottom-right"          # bottom-right | bottom-left | top-right | top-left | center
scale = 1.0                        # legend size: 0.8 = smaller, 1.2 = larger (0.5–2)
reduced_motion = false

[colors]                           # categories usable as color = "<name>"; add your own
# nav = "#4dabf7"

[sounds]                           # short feedback sounds; a binding can set sound = "<name>" or "" (silent)
enabled = true
volume  = 0.25                     # 0–1
# by colour group (a binding's color) — macOS sounds: Basso Blow Bottle Frog Funk Glass Hero Morse Ping Pop Purr Sosumi Submarine Tink
nav    = "click@0.6"               # windows, tabs, panes — soft generated click
act    = "Pop"
skill  = "Bottle"
danger = "Basso"                   # close, kill, clear
sys    = "click@0.6"
ok     = ""                        # Enter: silent
warn   = ""                        # Esc: silent
# named sounds
new    = "Hero"                    # New session
mode   = "Purr"
picker = "Morse"                   # a list opens
select = "Pop"                     # a list or menu item is chosen
scroll = "tick@0.5"                # each step in a list/menu — built-ins: tick, click; "@0.5" = half volume
cancel = "Blow"                    # ⏸ / ✕ Cancel / backing out of a menu
error  = "Funk"                    # an action failed
drum_full  = 48                     # velocity that counts as a full hit (the SMC-PAD sends ~10 soft … ~40 firm)
drum_curve = 0.5                   # loudness vs. how hard you hit: 1 = linear, lower = soft hits louder
drum_floor = 0.55                  # loudness of the softest hit (0–1); 1 = every hit full volume
# Drums: every pad with nothing to do on the current layer (no binding, a window that doesn't exist, a question's
# pad past its last option, …) plays one. The kit is handed out in this order to those pads, lowest pad first, so
# even two idle pads make a beat (past the end it starts over); a pad's label is its drum's name.
kit = ["kick", "snare", "hat", "open_hat", "clap", "low_tom", "high_tom", "cowbell"]
# Roland TR-707 samples (public domain, sounds/tr707/README.txt); any .wav/.aiff path works
kick     = "sounds/tr707/BassDrum1.wav@4"
snare    = "sounds/tr707/Snare1.wav@4"
hat      = "sounds/tr707/HhC.wav@4"
open_hat = "sounds/tr707/HhO.wav@4"
clap     = "sounds/tr707/HandClap.wav@4"
low_tom  = "sounds/tr707/LowTom.wav@4"
high_tom = "sounds/tr707/HiTom.wav@4"
cowbell  = "sounds/tr707/CowBell.wav@4"
# Mini-sampler: hold a drum pad and, once it turns red, it records from the microphone until you let go; from
# then on that pad plays your sound (trimmed and levelled). Let go right after it turns red and it keeps
# recording until you tap the pad (or ●) again. While you hold a pad with a sample:
#   ● records it again (hold ● while you speak, or tap ● to start and tap again to stop)  ·  ⏸ erases it
# — then ● doesn't talk and ⏸ doesn't send Esc. A take without a sound keeps what the pad had. The menu has
# "Erase pad sample ›" (one pad, or all). Files: ~/Library/Application Support/paddington/samples
sample_hold = 0.8                  # seconds holding a drum pad before it records
sample_max  = 5                    # longest sample (seconds)
sample_gain = 4                    # loudness like the kit's "@4"
sample_mode = "gate"               # gate: plays while the pad is held (tap = its start) · one_shot: always to the end

[led]                              # pad lights over Bluetooth (bank A = normal layer, bank B = shift layer)
mode = "live"                      # live: groups + agent status · groups: group colours only · off
brightness = 1.0                   # pads in general (0–1)
window_brightness = 0.3            # other windows' pads; the current window is always full brightness
night = 0.3                        # Paddington menu › Dim pad lights (night) multiplies every level by this
# colours by group / status / mode — override any, e.g.:
# nav = "#0000ff"                  # windows
# working = "#00ffff"
# needs_input = "#ffff00"

[sleep]                            # saves the pad's battery: the 16 pad lights go dark when you aren't using it
                                   # (the side buttons and BT stay lit: the firmware drives them, nothing turns them off)
after = "5m"                       # without a press, turn or button for this long ("0" = never sleep)
level = 0.0                        # light level while asleep: 0 = off, e.g. 0.05 = faint
wake_for_agents = false            # true: an agent that starts waiting for you wakes the lights
# asleep, the first press, turn or button only wakes the pad (it does nothing else); the menu has "Sleep now".
# A pad switched off and on again (or back in range) comes back awake.
